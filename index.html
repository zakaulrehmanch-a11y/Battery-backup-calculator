
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a27">
<title>Punjab Power Solutions</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f4;font-family:Arial,sans-serif;color:#102a27}
main{max-width:500px;margin:auto;padding:20px 17px}
.brand{background:#102a27;color:white;padding:24px;border-radius:17px}
.brand h2{margin:0;font-size:24px;line-height:1.35;letter-spacing:1px}
.brand p{color:#c6d8d1;margin:8px 0 0;font-size:12px}
h1{font-size:25px;margin:25px 0 5px}
.sub{color:#64746e;font-size:14px}
.card{background:white;padding:20px;border-radius:17px;margin-top:18px;box-shadow:0 4px 15px #00000010}
label{display:block;color:#176b5b;font-weight:bold;font-size:13px;margin:18px 0 8px}
input,select{width:100%;padding:13px;border:1px solid #d6e1dc;border-radius:10px;font-size:17px}
input[type=range]{padding:0;accent-color:#176b5b}
button{width:100%;padding:16px;background:#176b5b;color:white;border:0;border-radius:11px;font-size:16px;font-weight:bold;margin-top:22px}
#result{background:#e4efeb;border-radius:13px;text-align:center;padding:20px;margin-top:20px}
#hours{font-size:34px;font-weight:bold;margin:10px}
.small{font-size:12px;color:#64746e;line-height:1.5}
.footer{text-align:center;padding:24px 5px;color:#64746e;font-size:12px}
</style>
</head>
<body>
<main>
<div class="brand">
<h2>⚡ PUNJAB POWER<br>SOLUTIONS</h2>
<p>SMART POWER. RELIABLE SOLUTIONS.</p>
</div>

<h1>Battery Backup Calculator</h1>
<p class="sub">Calculate your battery backup time instantly.</p>

<div class="card">
<label>Battery Voltage</label>
<select id="v">
<option value="12">12V</option>
<option value="24">24V</option>
<option value="48" selected>48V</option>
</select>

<label>Battery Capacity (Ah)</label>
<input id="ah" type="number" value="100" min="0.1">

<label>Total Load (Watts)</label>
<input id="load" type="number" value="1000" min="0.1">

<label>Usable Capacity (DOD): <span id="dval">90%</span></label>
<input id="dod" type="range" min="30" max="100" value="90">

<label>Inverter Efficiency: <span id="eval">90%</span></label>
<input id="eff" type="range" min="80" max="98" value="90">

<button onclick="calculate()">CALCULATE BACKUP</button>

<div id="result">
<div class="small">ESTIMATED BATTERY BACKUP</div>
<div id="hours">Calculating...</div>
<div id="energy">Usable energy</div>
</div>
</div>

<div class="footer">
<strong>PUNJAB POWER SOLUTIONS</strong>
<p>Smart Power. Reliable Solutions.</p>
<p>Battery & Solar Power Calculation Tool</p>
</div>

<script>
const $=id=>document.getElementById(id);

function calculate(){
let v=Number($("v").value);
let ah=Number($("ah").value);
let load=Number($("load").value);
let dod=Number($("dod").value)/100;
let eff=Number($("eff").value)/100;

$("dval").textContent=$("dod").value+"%";
$("eval").textContent=$("eff").value+"%";

if(!(ah>0&&load>0&&Number.isFinite(ah)&&Number.isFinite(load))){
$("hours").textContent="Invalid values";
$("energy").textContent="Enter valid capacity and load.";
return;
}

let usable=v*ah*dod*eff;
let time=usable/load;
let h=Math.floor(time);
let m=Math.round((time-h)*60);

if(m===60){h++;m=0;}

$("hours").textContent=h+"h "+m+"m";
$("energy").textContent="Usable energy: "+Math.round(usable)+" Wh";
}

["v","ah","load","dod","eff"].forEach(id=>{
$(id).addEventListener("input",calculate);
});
calculate();
</script>
</main>
</body>
</html>
